prodcheck {
  instance = "courier"
  instance = ${?INSTANCE_NAME}
  second.table = "courier_audit"
}

db {
  jdbcUrl = "jdbc:postgresql://localhost:55432/outbox"
  jdbcUrl = ${?POSTGRES_URL}
  username = "outbox"
  password = "outbox"
  poolName = "courier"
  maxPoolSize = 24
  maxPoolSize = ${?DB_POOL_SIZE}
  connectionTimeout = 3s
  dsProperties {
    ApplicationName = ${prodcheck.instance}
    socketTimeout = "30"
  }
}

httpClient.target {
  url = "http://localhost:9090"
  url = ${?TARGET_URL}
  requestTimeout = 3s
}

httpServer {
  publicApiHttpPort = 9081
  publicApiHttpPort = ${?HTTP_PORT}
  privateApiHttpPort = 9086
  privateApiHttpPort = ${?METRICS_PORT}
}

outboxAdmin {
  adminKey = "prodcheck-admin"
  readerKey = "prodcheck-reader"
}

outbox {
  relay {
    workers = 4
    batchSize = 100
    batchTimeout = 10s
    shutdownTimeout = 15s
    retry {
      initialDelay = 200ms
      maxDelay = 5s
    }
  }
  partitions.maintenanceInterval = 5s
}

logging.level {
  "root": "WARN"
  "ru.tinkoff.kora": "INFO"
  "io.github.dsudomoin.outbox": "INFO"
}
