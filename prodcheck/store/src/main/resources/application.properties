# The environment contract of shop (prodcheck/README.md); Kora-shaped -D keys of the scenarios map onto Spring here.
prodcheck.instance=${INSTANCE_NAME:store}
prodcheck.hook=none
prodcheck.target.url=${TARGET_URL:http://localhost:9090}
prodcheck.target.request-timeout=${httpClient.target.requestTimeout:2s}
prodcheck.target-db.url=${TARGET_DB_URL:jdbc:postgresql://localhost:55433/outbox}
prodcheck.target-db.connection-timeout=${targetDb.connectionTimeout:2s}
prodcheck.target-db.socket-timeout=${targetDb.dsProperties.socketTimeout:5}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:55432/outbox}
spring.datasource.username=outbox
spring.datasource.password=outbox
spring.datasource.hikari.pool-name=store
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
# connection-timeout: db.connectionTimeout (default 3s), set in StoreApp: Hikari's key takes milliseconds only
spring.datasource.hikari.data-source-properties[ApplicationName]=${prodcheck.instance}
spring.datasource.hikari.data-source-properties[socketTimeout]=${db.dsProperties.socketTimeout:30}
spring.datasource.hikari.data-source-properties[prepareThreshold]=${db.dsProperties.prepareThreshold:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${HTTP_PORT:9080}

management.server.port=${METRICS_PORT:9085}
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.path-mapping.health=system
management.endpoint.health.probes.enabled=true

outbox-admin.admin-key=prodcheck-admin
outbox-admin.reader-key=prodcheck-reader

outbox.relay.workers=4
outbox.relay.batch-size=100
outbox.relay.batch-timeout=10s
outbox.relay.shutdown-timeout=15s
outbox.relay.retry.initial-delay=200ms
outbox.relay.retry.max-delay=5s
outbox.partitions.maintenance-interval=5s

logging.level.root=WARN
logging.level.io.github.dsudomoin.outbox=INFO
