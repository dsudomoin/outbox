prodcheck {
  instance = "accounts"
  instance = ${?INSTANCE_NAME}
}

accounts {
  lockTimeoutMs = 0
  holdSameType = false
}

db {
  jdbcUrl = "jdbc:postgresql://localhost:55432/outbox"
  jdbcUrl = ${?POSTGRES_URL}
  username = "accounts_rw"
  password = "accounts_rw"
  poolName = "db"
  maxPoolSize = 10
  schema = "accounts"

  dsProperties {
    "connectTimeout" = "10"
    "socketTimeout" = "30"
    "loginTimeout" = "10"
    "hostRecheckSeconds" = "2"
    "ApplicationName" = ${prodcheck.instance}
  }
}

ownerDb = ${db}
ownerDb {
  jdbcUrl = ${db.jdbcUrl}
  jdbcUrl = ${?POSTGRES_OWNER_URL}
  username = "accounts_owner"
  password = "accounts_owner"
  poolName = "owner-db"
  maxPoolSize = 2
}

outbox {
  table = "accounts.account_events"
  schema.bootstrap = false

  relay {
    workers = 1
    batchSize = 100
  }

  partitions.tailConversion.zone = "UTC"
}

httpServer {
  publicApiHttpPort = 9082
  publicApiHttpPort = ${?HTTP_PORT}
  privateApiHttpPort = 9087
  privateApiHttpPort = ${?METRICS_PORT}
}

logging.level {
  "root": "WARN"
  "ru.tinkoff.kora": "INFO"
  "io.github.dsudomoin.outbox": "INFO"
}
