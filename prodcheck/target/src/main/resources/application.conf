prodcheck {
  instance = "target"
  instance = ${?INSTANCE_NAME}
}

db {
  jdbcUrl = "jdbc:postgresql://localhost:55433/outbox"
  jdbcUrl = ${?POSTGRES_URL}
  username = "outbox"
  password = "outbox"
  poolName = "target"
  maxPoolSize = 32
  maxPoolSize = ${?DB_POOL_SIZE}
  connectionTimeout = 3s
  dsProperties {
    ApplicationName = ${prodcheck.instance}
    socketTimeout = "30"
  }
}

httpServer {
  publicApiHttpPort = 9090
  publicApiHttpPort = ${?HTTP_PORT}
  privateApiHttpPort = 9095
  privateApiHttpPort = ${?METRICS_PORT}
  blockingThreads = 64
}

logging.level {
  "root": "WARN"
  "ru.tinkoff.kora": "INFO"
  "io.github.dsudomoin.outbox": "INFO"
}
